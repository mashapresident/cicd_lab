ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [ com.podcastapp.ApplicationKt.module ]
  }
}

app {
  db {
    url = "jdbc:postgresql://localhost:5432/podcasts"
    url = ${?DB_URL}
    user = "podcasts"
    user = ${?DB_USER}
    password = "podcasts"
    password = ${?DB_PASSWORD}
  }
  jwt {
    secret = "dev-secret-change-me-dev-secret-change-me"
    secret = ${?JWT_SECRET}
    issuer = "podcast-app"
    accessTtlMinutes = 15
    refreshTtlDays = 30
  }
  rss {
    enabled = true
    enabled = ${?RSS_REFRESH_ENABLED}
    refreshIntervalMinutes = 60
  }
}
